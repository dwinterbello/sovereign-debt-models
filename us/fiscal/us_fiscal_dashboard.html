<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>US fiscal & funding</title>
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap");
:root {
  --bg:#ececec;
  --bg-grad-0:#ececec;
  --bg-grad-1:#ececec;
  --bg-grad-2:#ececec;
  --panel:#f5f5f5;
  --rail-0:#f5f5f5;
  --rail-1:#f5f5f5;
  --rail-2:#f5f5f5;
  --panel-hi:#ffffff;
  --plot-bg:#ffffff;
  --th-bg:#f3f3f3;
  --code-bg:#f3f3f3;
  --line:#c4c4c4;
  --line-dark:#8c8c8c;
  --grid:#d9d9d9;
  --hair:#e8e8e8;
  --text:#111111;
  --muted:#555555;
  --faint:#777777;
  --dim:#a0a0a0;
  --accent:#0072BD;
  --link:#0060a0;
  --hover:#e8eef5;
  --row-hover:#f2f6fa;
  --sel:#d9e6f2;
  --extreme:#fff8e6;
  --pos:#0072BD;
  --neg:#A2142F;
  --warn:#D95319;
  --flag:#EDB120;
  --ok:#2e7d32;
  --ok-bg:#edf5ee;
  --fail:#9b1c1c;
  --fail-bg:#fee2e2;
  --warn-bg:#fef3c7;
  --idle:#4a5563;
  --chart-grid:#d8d8d8;
  --chart-zero:#888888;
  --chart-axis:#333333;
  --chart-text:#222222;
  --chart-legend:#444444;
  --s1:#0072BD;
  --s2:#D95319;
  --s3:#EDB120;
  --s4:#7E2F8E;
  --s5:#77AC30;
  --s6:#4DBEEE;
  --s7:#A2142F;
  --s8:#000000;
  --heat-n3:#A2142F;
  --heat-n2:#c75a6c;
  --heat-n1:#e8b4bd;
  --heat-0:#fafbfc;
  --heat-p1:#b3d3ea;
  --heat-p2:#4d9ad0;
  --heat-p3:#0072BD;
  --sans:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",Menlo,Consolas,ui-monospace,monospace;
}

* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text);
       font:12px/1.45 var(--sans); font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased; }
a { color:var(--link); }
header { background:var(--panel); border-bottom:1px solid var(--line); color:var(--text); }
h1 { font-family:var(--sans); font-size:13px; font-weight:700; letter-spacing:0; color:var(--text); }
.sub { color:var(--muted); }
.card, .panel { background:var(--panel-hi); border:1px solid var(--line); border-radius:0; box-shadow:none; }
.card h3, .panel h3 { color:var(--text); font-weight:700; }
.note { color:var(--muted); }
code { background:var(--code-bg); font-family:var(--mono); }
select, input, button { font-family:inherit; }
select, input { background:var(--panel-hi); color:var(--text); border:1px solid var(--line); border-radius:0; }
.pos, td.pos { color:var(--pos); }
.neg, td.neg { color:var(--neg); }
table { border-collapse:collapse; font-variant-numeric:tabular-nums; }
th, td { border-bottom:1px solid var(--hair); }
th { position:sticky; top:0; z-index:1; background:var(--th-bg); color:var(--muted); font-weight:600;
     border-bottom:1px solid var(--line); }
td { font-family:var(--mono); font-size:11px; color:var(--text); }
td:first-child, th:first-child { font-family:var(--sans); }
tbody tr:hover td { background:var(--row-hover); }
tr.extreme td { background:var(--extreme); }
td.hm, td.heat { text-align:center; }
td.na, tr.dim td { color:var(--dim); }

table.dense { width:100%; border-collapse:collapse; font:11px/1.3 var(--mono); }
table.dense th, table.dense td { padding:4px 9px; border-bottom:1px solid var(--hair); text-align:right; white-space:nowrap; }
table.dense th { position:sticky; top:0; background:var(--th-bg); color:var(--muted); font-weight:600;
                 border-bottom:1px solid var(--line); z-index:1; }
table.dense td:first-child, table.dense th:first-child { text-align:left; font-weight:600; }
table.dense tbody tr:hover { background:var(--row-hover); }

body { margin: 0; color: var(--text); font: 12px/1.45 var(--sans); font-variant-numeric: tabular-nums; }
header { padding: 10px 16px; }
h1 { margin: 0; }
.sub { color: var(--muted); font-size: 11px; margin-top: 4px; max-width: 1080px; line-height: 1.45; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 10px 16px 36px; }
h2.section { font: 700 11px/1.3 var(--mono); margin: 22px 0 8px; color: var(--text);
  text-transform: uppercase; letter-spacing: 0.12em;
  border-bottom: 1px solid var(--grid); padding-bottom: 3px; }
.grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid-2 .span-2 { grid-column: 1 / -1; }
@media (max-width: 980px) { .grid-2 { grid-template-columns: 1fr; } }
.card { padding: 8px 10px; }
.kpi-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 6px; }
.kpi { border: 1px solid var(--line); border-top: 3px solid var(--accent); padding: 7px 10px; min-width: 148px; background: var(--panel-hi); }
.kpi .lbl { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.45px; font-weight: 600; }
.kpi .val { font: 600 16px/1.2 var(--mono); margin-top: 2px; }
.kpi .note { font-size: 10px; color: var(--muted); margin-top: 2px; }
code { font-size: 10px; }

html, body { height: 100%; }
body { margin: 0; display: flex; flex-direction: column; }
nav { display: flex; gap: 2px; padding: 6px 12px 0; border-bottom: 1px solid var(--line); background: var(--panel-hi); }
nav a { font: 600 11px/1 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted);
  padding: 8px 12px; border: 1px solid transparent; border-bottom: none; text-decoration: none; cursor: pointer; }
nav a.on { color: var(--text); border-color: var(--line); background: var(--bg, #fff); margin-bottom: -1px; }
nav .sp { flex: 1; }
nav a.pdf { text-transform: none; }
main { flex: 1; position: relative; }
main iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: none; }
main iframe.on { display: block; }
</style>
</head>
<body>
  <nav><a data-t="cash" href="#cash">Cash</a><a data-t="flows" href="#flows">Flows</a><a data-t="ceiling" href="#ceiling">Ceiling</a><span class="sp"></span><a class="pdf" href="report/US_Fiscal_Funding_Report.pdf" target="_blank">Report PDF</a></nav>
  <main><iframe id="f-cash" data-src="tga_deficit_dashboard.html" title="Cash"></iframe><iframe id="f-flows" data-src="tga_components_dashboard.html" title="Flows"></iframe><iframe id="f-ceiling" data-src="tga_ceiling_dashboard.html" title="Ceiling"></iframe></main>
<script>
const keys = ['cash', 'flows', 'ceiling'];
function show(k) {
  if (!keys.includes(k)) k = keys[0];
  document.querySelectorAll('nav a[data-t]').forEach(a => a.classList.toggle('on', a.dataset.t === k));
  document.querySelectorAll('main iframe').forEach(f => {
    const on = f.id === 'f-' + k;
    if (on && !f.src) f.src = f.dataset.src;
    f.classList.toggle('on', on);
  });
}
window.addEventListener('hashchange', () => show(location.hash.slice(1)));
show(location.hash.slice(1));
</script>
</body>
</html>
